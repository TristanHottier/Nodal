name: Bug report
description: Something in Nodal doesn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Nodal version
      description: Shown in the status bar, for example "Engine 1.2.0".
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Project file and screenshots
      description: If the bug depends on a circuit, drag a `.nodal.json` file here (Save as... in the top bar). GitHub may need it renamed to `.nodal.json.txt`.
