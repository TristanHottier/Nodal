name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p nodal-cli --release -- validate validation --report validation-report.md
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: validation-report.md
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: wasm-pack test --node crates/nodal-wasm
      - run: pnpm install --frozen-lockfile
      # pkg/ is built from this commit, in this job; it is gitignored and never cached.
      # It must exist before lint, typecheck and test (tsconfig maps @nodal/wasm to it).
      - run: pnpm build:wasm
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @nodal/web build
      - run: node scripts/check-base-path.mjs apps/web/dist
      - run: pnpm --filter @nodal/web exec playwright install --with-deps chromium firefox
      - run: pnpm --filter @nodal/web e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - name: Check gzipped WASM size (< 1 MB)
        run: |
          size=$(gzip -9 -c crates/nodal-wasm/pkg/nodal_wasm_bg.wasm | wc -c)
          echo "nodal_wasm_bg.wasm gzipped: ${size} bytes (limit 1048576)"
          if [ "$size" -ge 1048576 ]; then
            echo "::error::Gzipped WASM is ${size} bytes, at or over the 1 MB limit"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: [rust, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
