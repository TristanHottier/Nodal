<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Mirrors readThemeChoice in src/theme/theme.ts: apply a stored theme before first paint.
      try {
        var t = localStorage.getItem("nodal-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          // A forced choice must also fix the browser's default canvas, or Light on a dark OS paints dark first.
          document.documentElement.style.colorScheme = t;
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/Nodal/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/Nodal/favicon-32.png" />
    <link rel="apple-touch-icon" href="/Nodal/apple-touch-icon.png" />
    <title>Nodal</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
